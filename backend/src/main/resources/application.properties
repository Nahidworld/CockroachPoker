spring.application.name=backend

# Hosts such as Render set PORT; locally the backend stays on 8080.
server.port=${PORT:8080}

# Behind a hosting proxy, read the visitor's address from X-Forwarded-For so the
# room-creation limit counts each visitor separately instead of the proxy as one client.
server.forward-headers-strategy=framework

# Browser origins allowed to call /api and open /ws (comma-separated; patterns like
# https://*.vercel.app work). In production set ALLOWED_ORIGINS to the frontend's address.
game.allowed-origins=${ALLOWED_ORIGINS:*}
