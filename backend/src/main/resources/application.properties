spring.application.name=backend

# Hosts such as Render set PORT; locally the backend stays on 8080.
server.port=${PORT:8080}

# Behind a hosting proxy, read the visitor's address from X-Forwarded-For so the
# room-creation limit counts each visitor separately instead of the proxy as one client.
server.forward-headers-strategy=framework

# Browser origins allowed to call /api and open /ws (comma-separated; patterns like
# https://*.vercel.app work). In production set ALLOWED_ORIGINS to the frontend's address.
game.allowed-origins=${ALLOWED_ORIGINS:*}

# Free Render services sleep after 15 minutes without requests. The backend pings its own public
# /api/health address every 10 minutes to stay awake. Render sets RENDER_EXTERNAL_URL itself;
# locally it is unset, so nothing is pinged. Set the environment variable KEEP_AWAKE=false to turn it off.
game.keep-awake-enabled=${KEEP_AWAKE:true}
game.keep-awake-url=${RENDER_EXTERNAL_URL:}
