spring.application.name=backend

# OpenAPI / Swagger UI (REST only; STOMP is documented in docs/api)
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# H2 in-memory database + web console.
# Game/room state is still held in memory by the services; this database is empty by default
# and exists so tables can be inspected or added without a separate server.
spring.datasource.url=jdbc:h2:mem:cockroachpoker;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
